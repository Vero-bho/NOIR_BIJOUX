# Полный запуск Noir Bijoux в Docker.
# База данных остаётся облачной: PostgreSQL в Supabase.
# Строка DATABASE_URL передаётся только контейнеру backend из backend/.env.
# Запуск из корня проекта: docker compose up --build -d

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: "4000"
      UPLOAD_DIR: uploads
    ports:
      - "4000:4000"
    volumes:
      - noir-bijoux-uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Адрес API для браузера. Для локального запуска он доступен на хосте.
        # Для размещения в интернете укажите публичный HTTPS URL API.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
    ports:
      - "5173:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  noir-bijoux-uploads:
